name: Feature request
description: Propose a new capability for the Go2 Tier-1 simulator
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? Who hits it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: A concrete description of the new capability and its contract.
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: Design sketch
      description: |
        Interfaces, data flow, or a short example. The seams are fixed
        (skill → payment gate → Zenoh link → metrics) — show where the
        feature plugs in, and which registry files it touches.
  - type: textarea
    id: tests
    attributes:
      label: Testing plan
      description: How will this be tested offline with deterministic physics?
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I read CONTRIBUTING.md and ROADMAP.md
        - label: My proposal keeps `bash simulation/verify_go2_tier1.sh` green
        - label: New skills stay offline-testable (no network / keys required)
